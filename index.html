<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D 家具配置シミュレーター</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="app-header">
    <h1>2D 家具配置シミュレーター</h1>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section class="panel">
        <h2>部屋の保存・読み込み</h2>
        <div class="field-row">
          <input type="text" id="room-name" placeholder="部屋の名前" />
        </div>
        <div class="field-row">
          <button id="save-room-btn">部屋を保存</button>
          <button id="new-room-btn" class="secondary">新規部屋</button>
        </div>
        <div class="field-row">
          <select id="saved-rooms-select">
            <option value="">-- 保存済みの部屋 --</option>
          </select>
        </div>
        <div class="field-row">
          <button id="load-room-btn">読み込む</button>
          <button id="delete-room-btn" class="danger">削除</button>
        </div>
      </section>

      <section class="panel">
        <h2>部屋の形</h2>
        <div class="field-row">
          <label>形のタイプ
            <select id="room-shape-type">
              <option value="rect">長方形</option>
              <option value="polygon">自由な形(多角形)</option>
            </select>
          </label>
        </div>

        <div id="rect-controls">
          <div class="field-row">
            <label>幅 (cm)<input type="number" id="room-width" min="10" step="1" value="400" /></label>
            <label>奥行き (cm)<input type="number" id="room-depth" min="10" step="1" value="300" /></label>
          </div>
          <div class="field-row">
            <button id="apply-room-size-btn">この寸法で反映</button>
          </div>
        </div>

        <div id="polygon-controls" hidden>
          <p class="hint">部屋の上をクリックして角を順番に追加してください(3点以上)。下のリストで座標を数値で微調整できます。</p>
          <div class="field-row">
            <button id="polygon-undo-btn" class="secondary">1つ戻す</button>
            <button id="polygon-clear-btn" class="danger">クリア</button>
          </div>
          <div class="field-row">
            <label><input type="checkbox" id="polygon-snap" checked /> 10cm単位でスナップ</label>
          </div>
          <ul id="polygon-points-list" class="points-list"></ul>
          <div class="field-row">
            <button id="polygon-add-point-btn" class="secondary">頂点を数値で追加</button>
          </div>
        </div>
      </section>

      <section class="panel">
        <h2>家具を登録</h2>
        <div class="field-row">
          <label>名前<input type="text" id="furn-name" placeholder="例: ソファ" /></label>
        </div>
        <div class="field-row">
          <label>幅 (cm)<input type="number" id="furn-width" min="1" step="1" value="80" /></label>
        </div>
        <div class="field-row">
          <label>奥行き (cm)<input type="number" id="furn-depth" min="1" step="1" value="40" /></label>
        </div>
        <div class="field-row">
          <label>色<input type="color" id="furn-color" value="#4f8bd6" /></label>
        </div>
        <div class="field-row">
          <button id="add-furniture-btn">家具リストに追加</button>
        </div>
      </section>

      <section class="panel">
        <h2>家具リスト</h2>
        <p class="hint">ドラッグして部屋に配置できます</p>
        <ul id="furniture-list" class="furniture-list"></ul>
      </section>
    </aside>

    <section class="room-area-wrapper">
      <div class="room-toolbar">
        <span id="room-dims-label">400cm × 300cm</span>
        <span class="selected-tools" id="selected-tools" hidden>
          <label class="rotate-label">向き
            <input type="range" id="rotate-slider" min="0" max="359" step="1" value="0" />
            <input type="number" id="rotate-number" min="0" max="359" step="1" value="0" />°
          </label>
          <button id="rotate-90-btn" class="secondary">+90°</button>
          <button id="delete-placement-btn" class="danger">この家具を削除</button>
        </span>
      </div>
      <div id="room" class="room"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
